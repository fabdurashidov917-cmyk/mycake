media:
  input: assets/images
  output: assets/images

content:
  - name: menu
    label: "🍰 Shirinliklar Menyusi"
    type: file
    path: menu.json
    format: json
    list: true
    fields:
      - name: nomi
        label: "Mahsulot nomi"
        type: string
        required: true
        description: "Shirinlikning to'liq nomini yozing. Masalan: By Dilis Kinder kattasi, San Sebastian Classika"

      - name: kategoriya
        label: "Kategoriya"
        type: select
        required: true
        description: "Mahsulot saytda to'g'ri bo'limda chiqishi uchun ro'yxatdan birini tanlang"
        options:
          values:
            - tortlar
            - pishiriqlar
            - desertlar
            - ichimliklar

      - name: tavsif
        label: "Tavsifi"
        type: text
        description: "Tarkibi va ta'mi haqida qisqacha ma'lumot (masalan: Belgia shokoladi, mayin biskvit)"

      - name: narxi
        label: "Asosiy narxi (so'm)"
        type: number
        description: "Faqat raqam yozing (masalan: 159000). Probel, so'm yoki nuqta ishlatmang!"

      - name: dona_narxi
        label: "Dona narxi (so'm)"
        type: number
        description: "Bo'laklab sotilsa yozing (faqat raqam, masalan: 28000). Bo'lmasa bo'sh qoldiring"

      - name: butun_narxi
        label: "Butun narxi (so'm)"
        type: number
        description: "Butun holda sotiladigan narxi (faqat raqam, masalan: 220000). Bo'lmasa bo'sh qoldiring"

      - name: qoshimcha
        label: "Qo'shimcha nishon"
        type: string
        description: "Saytda yorliq bo'lib ko'rinadi. Masalan: ⭐ TOP XIT, 🔥 AKSIYA, ✨ YANGILIK"

      - name: rasmlar
        label: "Rasmlar (Karusel)"
        type: image
        list: true
        description: "Birinchi rasm asosiy muqova bo'ladi. Sayt tez ochilishi uchun har bir rasm hajmi 1-2 MB dan oshmasin"